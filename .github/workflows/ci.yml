name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path .github '**/*.md'
          fail: true
